plugins { id 'com.android.application' }
def environment = new Properties()
def environmentFile = rootProject.file('../.env')
if (environmentFile.exists()) environmentFile.withInputStream { environment.load(it) }
def appOrigin = System.getenv('APP_ORIGIN') ?: environment.getProperty('APP_ORIGIN')
def recorderRelease = new groovy.json.JsonSlurper().parse(rootProject.file('recorder-release.json'))
def appVersionName = recorderRelease.versionName
def bytedecoVersion = '1.5.13'
def ffmpegVersion = "8.0.1-${bytedecoVersion}"
// Project-local override for updating an APK signed on another workstation.
// The keystore itself stays outside the checkout; never replace ~/.android/debug.keystore.
def localSigning = new Properties()
def localSettings = rootProject.file('local.properties')
if (localSettings.exists()) localSettings.withInputStream { localSigning.load(it) }
def debugKeystore = System.getenv('DINKVISION_DEBUG_KEYSTORE') ?: localSigning.getProperty('dinkvision.debugKeystore')
def releaseKeystore = System.getenv('ANDROID_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
if (!appOrigin || !(appOrigin ==~ /^https:\/\/[^\/?#]+$/))
    throw new GradleException('Set APP_ORIGIN to the hosted HTTPS origin in the repository .env or build environment.')
android {
    namespace 'com.casabatik.recorder'
    compileSdk 36
    defaultConfig {
        applicationId 'com.casabatik.recorder'
        minSdk 26
        targetSdk 36
        versionCode recorderRelease.versionCode
        versionName appVersionName
        buildConfigField 'String', 'APP_ORIGIN', '"' + appOrigin + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    testBuildType project.hasProperty('localRecorderTests') ? 'debugLocal' : 'debug'
    signingConfigs {
        if (debugKeystore) {
            debug {
                storeFile file(debugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debugLocal {
            initWith debug
            applicationIdSuffix '.dev'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'APP_ORIGIN', '"http://127.0.0.1:3000"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/native-image/**'] }; jniLibs { useLegacyPackaging = true } }
}
if (!releaseSigningReady)
    logger.lifecycle('Android release signing is not configured; release APK/AAB outputs will be unsigned.')
configurations { nativeBundles; uvcOriginal }

// Retain the upstream drivers/resources but compile the single recorder class
// with its public AudioRecord hook. Check the downloaded input before replacing it.
def routedUvc = layout.buildDirectory.file('uvc-routing/UVCAndroid-1.0.13-routed.aar')
def prepareRoutedUvc = tasks.register('prepareRoutedUvc') {
    inputs.files(configurations.uvcOriginal)
    outputs.file(routedUvc)
    doLast {
        def original = configurations.uvcOriginal.singleFile
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
        if (hash != '4f1295a6c6b5e8590fb7dde3c60f30a94166db45c2d07efa63c85d5da8bfff17')
            throw new GradleException('Unexpected UVCAndroid 1.0.13 AAR. Review the vendored audio hook before updating it.')
        def destination = routedUvc.get().asFile
        destination.parentFile.mkdirs()
        new java.util.zip.ZipFile(original).withCloseable { archive ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(destination)).withCloseable { output ->
                archive.entries().each { entry ->
                    output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    byte[] contents = archive.getInputStream(entry).withCloseable { it.bytes }
                    if (entry.name == 'classes.jar') {
                        def replacement = new ByteArrayOutputStream()
                        new java.util.zip.ZipInputStream(new ByteArrayInputStream(contents)).withCloseable { input ->
                            new java.util.zip.ZipOutputStream(replacement).withCloseable { jar ->
                                java.util.zip.ZipEntry item
                                while ((item = input.nextEntry) != null) {
                                    if (item.name == 'com/herohan/uvcapp/VideoCapture.class' || item.name.startsWith('com/herohan/uvcapp/VideoCapture$')) continue
                                    jar.putNextEntry(new java.util.zip.ZipEntry(item.name))
                                    jar.write(input.readAllBytes())
                                    jar.closeEntry()
                                }
                            }
                        }
                        contents = replacement.toByteArray()
                    }
                    output.write(contents)
                    output.closeEntry()
                }
            }
        }
    }
}
android.sourceSets.main.java.srcDir(rootProject.file('third_party/uvcandroid/src'))
android.sourceSets.main.assets.srcDir(rootProject.file('third_party/uvcandroid/licenses'))
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    uvcOriginal('com.herohan:UVCAndroid:1.0.13') { transitive = false }
    implementation files(prepareRoutedUvc)
    // Exact runtime dependencies from the upstream 1.0.13 POM.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'cn.hutool:hutool-core:5.8.35'
    implementation("org.bytedeco:javacv:${bytedecoVersion}") { transitive = false }
    implementation "org.bytedeco:javacpp:${bytedecoVersion}"
    implementation "org.bytedeco:ffmpeg:${ffmpegVersion}"
    nativeBundles "org.bytedeco:javacpp:${bytedecoVersion}:android-arm64"
    nativeBundles "org.bytedeco:javacpp:${bytedecoVersion}:android-x86_64"
    nativeBundles "org.bytedeco:ffmpeg:${ffmpegVersion}:android-arm64"
    nativeBundles "org.bytedeco:ffmpeg:${ffmpegVersion}:android-x86_64"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
def extracted = layout.buildDirectory.dir('native-libraries')
tasks.register('extractNative', Copy) {
    from { configurations.nativeBundles.collect { zipTree(it) } }
    include '**/*.so'
    eachFile { f ->
        def abi = f.path.contains('arm64-v8a') ? 'arm64-v8a' : 'x86_64'
        f.path = abi + '/' + f.name
    }
    includeEmptyDirs = false
    into extracted
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
extensions.getByName('android').sourceSets.main.jniLibs.srcDir(extracted)
tasks.named('preBuild').configure { dependsOn 'extractNative' }

// Android keeps local copies because packaged apps cannot read Next.js public
// files at runtime. Refuse to build if any copy differs from the public source.
def publicBrandLogo = rootProject.file('../public/dink-vision-logo.png')
def packagedBrandLogos = [
    file('src/main/assets/dink-vision-logo.png'),
    file('src/main/res/drawable/dink_vision_logo.png'),
    file('src/main/assets/wpc-logo.png'),
    file('src/main/res/drawable/wpc_logo.png')
]
tasks.register('verifyBrandLogo') {
    inputs.file(publicBrandLogo)
    inputs.files(packagedBrandLogos)
    doLast {
        if (!publicBrandLogo.isFile()) throw new GradleException('Missing public/dink-vision-logo.png')
        byte[] expected = publicBrandLogo.bytes
        packagedBrandLogos.each { logo ->
            if (!logo.isFile() || !java.util.Arrays.equals(expected, logo.bytes))
                throw new GradleException("${logo} must be an exact copy of public/dink-vision-logo.png")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyBrandLogo' }

def publicAppLogo = rootProject.file('../public/dinkvision-logo-square-1x1.png')
def packagedAppLogo = file('src/main/res/drawable/dinkvision_logo_square_1x1.png')
tasks.register('verifyAppLogo') {
    inputs.file(publicAppLogo)
    inputs.file(packagedAppLogo)
    doLast {
        if (!publicAppLogo.isFile())
            throw new GradleException('Missing public/dinkvision-logo-square-1x1.png')
        if (!packagedAppLogo.isFile()
                || !java.util.Arrays.equals(publicAppLogo.bytes, packagedAppLogo.bytes))
            throw new GradleException('The packaged app logo must exactly match public/dinkvision-logo-square-1x1.png')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyAppLogo' }

def publicPlayerBackgrounds = [
    rootProject.file('../public/Kiosk-Background-Phone.png'),
    rootProject.file('../public/Kiosk-Background-Tablet.png')
]
def packagedPlayerBackgrounds = [
    file('src/main/assets/Kiosk-Background-Phone.png'),
    file('src/main/assets/Kiosk-Background-Tablet.png')
]
tasks.register('verifyPlayerBackgrounds') {
    inputs.files(publicPlayerBackgrounds)
    inputs.files(packagedPlayerBackgrounds)
    doLast {
        publicPlayerBackgrounds.eachWithIndex { source, index ->
            def packaged = packagedPlayerBackgrounds[index]
            if (!source.isFile()) throw new GradleException("Missing ${source}")
            if (!packaged.isFile() || !java.util.Arrays.equals(source.bytes, packaged.bytes))
                throw new GradleException("${packaged} must be an exact copy of ${source}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPlayerBackgrounds' }

// Export one shareable APK outside the checkout. Android Studio retains its
// managed build output; do not create extra root/artifacts APK copies.
def debugApk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
def exportedApkName = "Dink-Vision-Recorder-${appVersionName}.apk"
def exportedApkDirectory = rootProject.file('../../DinkVision-APKs')
def exportDebugApk = tasks.register('exportDebugApk') {
    doNotTrackState('Copies the assembled APK outside the Android Gradle project.')
    inputs.file(debugApk)
    doLast {
        def exportedApk = new File(exportedApkDirectory, exportedApkName)
        exportedApkDirectory.mkdirs()
        java.nio.file.Files.copy(
            debugApk.get().asFile.toPath(),
            exportedApk.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        exportedApk.eachByte(8192) { buffer, count -> digest.update(buffer, 0, count) }
        def checksum = digest.digest().encodeHex().toString()
        new File(exportedApkDirectory, "${exportedApkName}.sha256").text =
            "${checksum}  ${exportedApkName}\n"
        println "Latest debug APK: ${exportedApk}"
    }
}
tasks.configureEach {
    if (name == 'assembleDebug') finalizedBy(exportDebugApk)
}
